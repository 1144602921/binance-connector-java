name: Apply Jetty 12 websocket test compatibility fixes

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'fix: migrate websocket tests to Jetty 12.1') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Migrate remaining Jetty 11 test APIs
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('clients')
          changed = []
          for path in root.rglob('*.java'):
              if '/src/test/' not in path.as_posix():
                  continue
              text = path.read_text(encoding='utf-8')
              original = text

              text = text.replace('import org.eclipse.jetty.websocket.api.RemoteEndpoint;\n', '')
              text = text.replace(
                  'connect(Mockito.any(), Mockito.any(), Mockito.any());',
                  'connect(Mockito.any(), Mockito.any(URI.class));')
              text = re.sub(
                  r'\n\s*RemoteEndpoint remoteEndpointMock = Mockito\.mock\(RemoteEndpoint\.class\);\n\s*Mockito\.doReturn\(remoteEndpointMock\)\.when\(sessionMock\)\.getRemote\(\);\n',
                  '\n',
                  text)
              text = re.sub(
                  r'RemoteEndpoint remote = sessionMock\.getRemote\(\);\n\s*Mockito\.verify\(remote\)\.sendString\(sendArgumentCaptor\.capture\(\), Mockito\.any\(\)\);',
                  'Mockito.verify(sessionMock).sendText(sendArgumentCaptor.capture(), Mockito.any());',
                  text)

              if text != original:
                  if 'URI.class' in text and 'import java.net.URI;' not in text:
                      imports = [line for line in text.splitlines() if line.startswith('import ')]
                      if imports:
                          last_import = imports[-1]
                          text = text.replace(last_import, last_import + '\nimport java.net.URI;', 1)
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('\n'.join(changed))

      - name: Compile and test before committing
        id: test
        continue-on-error: true
        run: mvn -f clients/pom.xml clean test -Dgpg.skip=true

      - name: Commit migrated test sources for user verification
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clients
          if git diff --cached --quiet; then
            echo 'No Jetty test source changes detected.'
            exit 0
          fi
          git commit -m 'fix: migrate websocket tests to Jetty 12.1'
          git push origin HEAD:dev

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git fetch origin dev
          git checkout origin/dev -- .github/workflows/jetty12-commit-test-fixes.yml || true
          git rm -f .github/workflows/jetty12-commit-test-fixes.yml || true
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'ci: remove temporary Jetty test migration workflow'
            git push origin HEAD:dev
          fi