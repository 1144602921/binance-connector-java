name: Jetty 12.1.10 test migration validation

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Migrate Jetty 11 test APIs
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('clients')
          changed = []
          for path in root.rglob('*.java'):
              if '/src/test/' not in path.as_posix():
                  continue
              text = path.read_text(encoding='utf-8')
              original = text

              text = text.replace('import org.eclipse.jetty.websocket.api.RemoteEndpoint;\n', '')
              text = text.replace('Mockito.any(), Mockito.any(), Mockito.any());', 'Mockito.any(), Mockito.any(URI.class));')
              text = re.sub(
                  r'\n\s*RemoteEndpoint remoteEndpointMock = Mockito\.mock\(RemoteEndpoint\.class\);\n\s*Mockito\.doReturn\(remoteEndpointMock\)\.when\(sessionMock\)\.getRemote\(\);\n',
                  '\n', text)
              text = re.sub(
                  r'RemoteEndpoint remote = sessionMock\.getRemote\(\);\n\s*Mockito\.verify\(remote\)\.sendString\(sendArgumentCaptor\.capture\(\), Mockito\.any\(\)\);',
                  'Mockito.verify(sessionMock).sendText(sendArgumentCaptor.capture(), Mockito.any());',
                  text)

              if text != original:
                  if 'Mockito.any(URI.class)' in text and 'import java.net.URI;' not in text:
                      marker = 'import java.net.'
                      if marker in text:
                          text = text.replace(marker, 'import java.net.URI;\nimport java.net.', 1)
                      else:
                          text = text.replace('import java.io.', 'import java.net.URI;\nimport java.io.', 1)
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed test files:')
          for item in changed:
              print(item)

      - name: Verify no Jetty 11 WebSocket test APIs remain
        shell: bash
        run: |
          if grep -RIn --include='*.java' -E 'org\.eclipse\.jetty\.websocket\.api\.RemoteEndpoint|\.getRemote\(\)|RemoteEndpoint remote|RemoteEndpoint remoteEndpointMock' clients/*/src/test; then
            echo 'Jetty 11 WebSocket test API residue found.'
            exit 1
          fi

      - name: Full Maven test
        run: mvn -f clients/pom.xml clean test -Dgpg.skip=true

      - name: Commit validated migration
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clients
          git diff --cached --quiet || git commit -m 'fix: migrate remaining websocket tests to Jetty 12.1'
          git push origin HEAD:dev

      - name: Remove temporary validation workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/jetty12-test-fix.yml
          git commit -m 'ci: remove temporary Jetty migration validator'
          git push origin HEAD:dev
